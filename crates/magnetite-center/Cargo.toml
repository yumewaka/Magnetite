[package]
name = "magnetite-center"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "magnetite-center"
path = "src/main.rs"

[dependencies]
# Shared bearer-GET HTTP client (same TLS posture as the /repl feeds) for polling
# each managed server's /mgmt/* agent API.
magnetite-feed = { path = "../magnetite-feed" }
axum = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
surrealdb = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
