<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magnetite Center</title>
<style>
  /* ---- Control-room palette: cool slate ground, telemetry-teal accent, ---- */
  /* ---- semantic health hues kept distinct from the accent.            ---- */
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #f4f6f9;
    --surface-3: #e9edf3;
    --ink: #161c26;
    --ink-soft: #4d5766;
    --ink-faint: #828d9d;
    --line: #d9dfe8;
    --line-strong: #c3ccd8;
    --accent: #0d8f86;
    --accent-ink: #ffffff;
    --accent-soft: #d9f0ed;
    --good: #1f8a4c;
    --good-bg: #e2f3e8;
    --warn: #9a6a12;
    --warn-bg: #f7eed8;
    --bad: #c23a3a;
    --bad-bg: #f8e2e2;
    --idle: #6b7686;
    --idle-bg: #e7ebf1;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
    --shadow: 0 1px 2px rgba(20, 28, 40, .06), 0 4px 16px rgba(20, 28, 40, .05);
    --radius: 12px;
  }
  :root:not([data-theme="light"]) { @media (prefers-color-scheme: dark) {
    --bg: #0f141b;
    --surface: #171d26;
    --surface-2: #1d2530;
    --surface-3: #232c39;
    --ink: #e7ecf3;
    --ink-soft: #a6b1c0;
    --ink-faint: #717d8d;
    --line: #29323f;
    --line-strong: #384454;
    --accent: #34b3a8;
    --accent-ink: #05201d;
    --accent-soft: #12332f;
    --good: #57c483;
    --good-bg: #142a1d;
    --warn: #d6ab5c;
    --warn-bg: #2c2515;
    --bad: #e8756f;
    --bad-bg: #2f1a1a;
    --idle: #8391a3;
    --idle-bg: #212a36;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .28);
  } }
  :root[data-theme="dark"] {
    --bg: #0f141b;
    --surface: #171d26;
    --surface-2: #1d2530;
    --surface-3: #232c39;
    --ink: #e7ecf3;
    --ink-soft: #a6b1c0;
    --ink-faint: #717d8d;
    --line: #29323f;
    --line-strong: #384454;
    --accent: #34b3a8;
    --accent-ink: #05201d;
    --accent-soft: #12332f;
    --good: #57c483;
    --good-bg: #142a1d;
    --warn: #d6ab5c;
    --warn-bg: #2c2515;
    --bad: #e8756f;
    --bad-bg: #2f1a1a;
    --idle: #8391a3;
    --idle-bg: #212a36;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .28);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: var(--accent); }

  /* ---- Top bar ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 1rem;
    padding: .7rem 1.25rem;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: saturate(1.2) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: .6rem; font-weight: 700; letter-spacing: -.01em; }
  .brand .mark {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
    position: relative; flex: none;
  }
  .brand .mark::after {
    content: ""; position: absolute; inset: 6px;
    border-radius: 2px; border: 2px solid var(--accent-ink); opacity: .85;
  }
  .brand small { color: var(--ink-faint); font-weight: 500; letter-spacing: .02em; }
  .spacer { flex: 1; }
  .conn { display: flex; align-items: center; gap: .5rem; font-size: .82rem; color: var(--ink-soft); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
  .dot.on { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
  .dot.off { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }

  .btn {
    appearance: none; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    padding: .42rem .8rem; border-radius: 8px; font-weight: 600; font-size: .85rem;
    transition: background .12s, border-color .12s, transform .05s;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  .btn:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn.sm { padding: .28rem .55rem; font-size: .78rem; }

  main { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  /* ---- Summary stat strip ---- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; margin-bottom: 1.4rem; }
  @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: .85rem 1rem; box-shadow: var(--shadow);
  }
  .stat .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); font-weight: 600; }
  .stat .v { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: .15rem; }
  .stat .v small { font-size: .9rem; color: var(--ink-faint); font-weight: 600; }
  .stat.alarm .v { color: var(--bad); }

  .section-head {
    display: flex; align-items: center; gap: .75rem; margin: 1.8rem 0 .8rem;
  }
  .section-head h2 { font-size: 1.05rem; margin: 0; letter-spacing: -.01em; }
  .section-head .count {
    font-family: var(--mono); font-size: .75rem; color: var(--ink-faint);
    background: var(--surface-3); padding: .1rem .5rem; border-radius: 999px;
  }

  /* ---- Clusters ---- */
  .clusters { display: flex; flex-wrap: wrap; gap: .6rem; }
  .chip-cluster {
    display: inline-flex; align-items: center; gap: .5rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: .35rem .8rem; font-size: .85rem; box-shadow: var(--shadow);
  }
  .chip-cluster .nm { font-weight: 600; }
  .chip-cluster .ct { font-family: var(--mono); font-size: .74rem; color: var(--ink-faint); }
  .chip-cluster.unassigned { border-style: dashed; color: var(--ink-soft); }

  /* ---- Server table ---- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; min-width: 760px; }
  thead th {
    text-align: left; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600; padding: .6rem .9rem;
    background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td { padding: .65rem .9rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface-2); }
  .srv-name { font-weight: 600; }
  .srv-url, .srv-id { font-family: var(--mono); font-size: .78rem; color: var(--ink-soft); }
  .srv-id { color: var(--ink-faint); }
  .muted { color: var(--ink-faint); }

  .pill {
    display: inline-flex; align-items: center; gap: .35rem;
    font-size: .74rem; font-weight: 700; padding: .16rem .55rem; border-radius: 999px;
    white-space: nowrap;
  }
  .pill .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.good { color: var(--good); background: var(--good-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.bad { color: var(--bad); background: var(--bad-bg); }
  .pill.idle { color: var(--idle); background: var(--idle-bg); }

  .domains { display: flex; flex-wrap: wrap; gap: .3rem; }
  .dchip {
    font-family: var(--mono); font-size: .7rem; font-weight: 600;
    padding: .1rem .4rem; border-radius: 5px; border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: .28rem;
  }
  .dchip .d { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .dchip.good { color: var(--good); background: var(--good-bg); }
  .dchip.warn { color: var(--warn); background: var(--warn-bg); }
  .dchip.bad { color: var(--bad); background: var(--bad-bg); }
  .dchip.idle { color: var(--idle); background: var(--idle-bg); }
  .role-tag { font-family: var(--mono); font-size: .64rem; opacity: .75; }
  .err-line { color: var(--bad); font-size: .76rem; font-family: var(--mono); margin-top: .2rem; }

  .row-actions { display: flex; gap: .35rem; justify-content: flex-end; white-space: nowrap; }

  /* cluster cards carry the failover policy controls */
  .chip-cluster { flex-direction: column; align-items: stretch; gap: .45rem; min-width: 210px; border-radius: 12px; padding: .7rem .85rem; }
  .chip-cluster .cl-top { display: flex; align-items: baseline; gap: .5rem; }
  .chip-cluster .cl-top .nm { font-weight: 700; font-size: .95rem; }
  .chip-cluster .cl-primary { font-size: .76rem; color: var(--ink-soft); }
  .chip-cluster .cl-primary b { color: var(--good); font-weight: 700; }
  .chip-cluster .cl-fo { display: flex; align-items: center; gap: .5rem; font-size: .78rem; color: var(--ink-soft); flex-wrap: wrap; }
  .chip-cluster .cl-fo input[type=number] { width: 3.2em; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 6px; padding: .1rem .3rem; font-family: var(--mono); }
  .switch { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer; user-select: none; }
  .switch input { accent-color: var(--accent); }

  .intent-sel { background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 7px; padding: .25rem .4rem; font-size: .8rem; }
  .dns-target { width: 8.5em; margin-top: .3rem; display: block; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 7px; padding: .2rem .4rem; font-size: .76rem; font-family: var(--mono); }
  .chip-cluster .cl-dns { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; font-size: .74rem; color: var(--ink-soft); border-top: 1px dashed var(--line); padding-top: .45rem; }
  .chip-cluster .cl-dns-lbl { font-weight: 600; }
  .chip-cluster .cl-dns input[type=text] { flex: 1; min-width: 6em; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 6px; padding: .15rem .35rem; font-family: var(--mono); font-size: .72rem; }
  .chip-cluster .cl-dns input[type=number] { width: 4.2em; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 6px; padding: .1rem .3rem; font-family: var(--mono); }
  .badge-fence { display: inline-flex; align-items: center; gap: .3rem; font-size: .68rem; font-weight: 700; color: var(--warn); background: var(--warn-bg); padding: .1rem .45rem; border-radius: 999px; margin-top: .25rem; }
  .badge-active { font-size: .64rem; font-weight: 700; color: var(--good); background: var(--good-bg); padding: .05rem .4rem; border-radius: 999px; margin-left: .35rem; vertical-align: middle; }

  .events { display: flex; flex-direction: column; gap: .35rem; }
  .event {
    display: grid; grid-template-columns: auto auto 1fr; gap: .6rem; align-items: baseline;
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--idle);
    border-radius: 8px; padding: .45rem .75rem; font-size: .82rem;
  }
  .event.failover { border-left-color: var(--accent); }
  .event.error { border-left-color: var(--bad); }
  .event .ev-time { font-family: var(--mono); font-size: .72rem; color: var(--ink-faint); white-space: nowrap; }
  .event .ev-kind { font-family: var(--mono); font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); }
  .event.error .ev-kind { color: var(--bad); }
  .event .ev-msg { color: var(--ink); }

  .empty {
    text-align: center; color: var(--ink-faint); padding: 2.5rem 1rem; font-size: .9rem;
  }

  /* ---- Forms / disclosure ---- */
  details.panel {
    margin-top: .8rem; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  details.panel > summary {
    cursor: pointer; list-style: none; padding: .7rem 1rem; font-weight: 600; font-size: .88rem;
    display: flex; align-items: center; gap: .5rem; user-select: none;
  }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::before {
    content: "+"; font-family: var(--mono); color: var(--accent); font-weight: 700; width: 1ch;
  }
  details.panel[open] > summary::before { content: "\2013"; }
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .7rem;
    padding: 0 1rem 1rem; align-items: end;
  }
  .field { display: flex; flex-direction: column; gap: .28rem; }
  .field label { font-size: .74rem; font-weight: 600; color: var(--ink-soft); letter-spacing: .01em; }
  .field input, .field select {
    background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px;
    padding: .45rem .6rem; width: 100%;
  }
  .field.actions { justify-content: end; }

  .toast {
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: .6rem 1rem; border-radius: 10px;
    font-size: .85rem; font-weight: 600; box-shadow: var(--shadow); opacity: 0;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--bad); color: #fff; }

  /* ---- Connect gate ---- */
  .gate {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
    background: var(--bg); padding: 1.5rem;
  }
  .gate .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); padding: 1.8rem; width: 100%; max-width: 380px;
  }
  .gate h1 { font-size: 1.2rem; margin: .6rem 0 .3rem; }
  .gate p { color: var(--ink-soft); font-size: .88rem; margin: 0 0 1.1rem; }
  .gate .field { margin-bottom: .9rem; }
  .hidden { display: none !important; }
  .lead-badge { font-size: .7rem; font-weight: 700; padding: .16rem .55rem; border-radius: 999px; font-family: var(--mono); white-space: nowrap; }
  .lead-badge.leader { color: var(--good); background: var(--good-bg); }
  .lead-badge.standby { color: var(--idle); background: var(--idle-bg); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- Connect gate: operator pastes the CENTER_ADMIN_TOKEN; kept client-side only. -->
<div class="gate" id="gate">
  <div class="card">
    <div class="brand"><span class="mark"></span> Magnetite Center</div>
    <h1>コントロールプレーンに接続</h1>
    <p>管理トークン（<code>CENTER_ADMIN_TOKEN</code>）を入力してください。トークンはこのブラウザのセッションにのみ保存されます。</p>
    <form id="gate-form">
      <div class="field">
        <label for="gate-token">管理トークン</label>
        <input id="gate-token" type="password" autocomplete="off" placeholder="Bearer トークン" />
      </div>
      <button class="btn primary" type="submit" style="width:100%">接続</button>
    </form>
  </div>
</div>

<header class="hidden" id="topbar">
  <div class="brand"><span class="mark"></span> Magnetite Center <small>コントロールプレーン</small></div>
  <div class="spacer"></div>
  <span class="lead-badge" id="lead-badge" title="この Center のHA役割" hidden></span>
  <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">—</span></div>
  <button class="btn ghost sm" id="btn-refresh" title="今すぐ更新">更新</button>
  <label class="conn" style="gap:.35rem"><input type="checkbox" id="auto" checked /> 自動</label>
  <button class="btn ghost sm" id="btn-logout" title="トークンを破棄">切断</button>
</header>

<main class="hidden" id="app">
  <div class="stats" id="stats"></div>

  <div class="section-head">
    <h2>クラスタ</h2><span class="count" id="cluster-count">0</span>
  </div>
  <div class="clusters" id="clusters"></div>
  <details class="panel">
    <summary>クラスタを作成</summary>
    <form class="form-grid" id="cluster-form">
      <div class="field">
        <label for="cl-name">名前</label>
        <input id="cl-name" required placeholder="prod / dr-site など" />
      </div>
      <div class="field actions">
        <button class="btn primary" type="submit">作成</button>
      </div>
    </form>
  </details>

  <div class="section-head">
    <h2>サーバ</h2><span class="count" id="server-count">0</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>サーバ</th><th>到達性</th><th>ドメイン ヘルス</th>
          <th>クラスタ</th><th>意図</th><th>最終確認</th><th></th>
        </tr>
      </thead>
      <tbody id="server-rows"></tbody>
    </table>
  </div>
  <details class="panel">
    <summary>サーバを登録</summary>
    <form class="form-grid" id="server-form">
      <div class="field">
        <label for="sv-name">名前</label>
        <input id="sv-name" required placeholder="dc1" />
      </div>
      <div class="field">
        <label for="sv-url">ベース URL</label>
        <input id="sv-url" required placeholder="https://dc1.example.com:4000" />
      </div>
      <div class="field">
        <label for="sv-token">mgmt トークン</label>
        <input id="sv-token" type="password" required placeholder="[mgmt] token" autocomplete="off" />
      </div>
      <div class="field">
        <label for="sv-cluster">クラスタ</label>
        <select id="sv-cluster"><option value="">（未割り当て）</option></select>
      </div>
      <div class="field actions">
        <button class="btn primary" type="submit">登録</button>
      </div>
    </form>
  </details>

  <div class="section-head">
    <h2>フェイルオーバー イベント</h2><span class="count" id="event-count">0</span>
  </div>
  <div class="events" id="events"></div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  const TKEY = "magnetite_center_token";
  let token = sessionStorage.getItem(TKEY) || "";
  let timer = null;

  const $ = (id) => document.getElementById(id);
  const gate = $("gate"), topbar = $("topbar"), app = $("app");

  function toast(msg, isErr) {
    const t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (isErr ? " err" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.className = "toast" + (isErr ? " err" : ""); }, 2600);
  }

  async function api(path, opts) {
    opts = opts || {};
    const headers = opts.headers || {};
    if (token) headers["authorization"] = "Bearer " + token;
    if (opts.body) headers["content-type"] = "application/json";
    const res = await fetch(path, { method: opts.method || "GET", headers, body: opts.body });
    if (res.status === 401) { logout(); throw new Error("認証に失敗しました"); }
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  function setConn(ok, text) {
    $("conn-dot").className = "dot " + (ok ? "on" : "off");
    $("conn-text").textContent = text;
  }

  function showApp() {
    gate.classList.add("hidden");
    topbar.classList.remove("hidden");
    app.classList.remove("hidden");
  }
  function showGate() {
    gate.classList.remove("hidden");
    topbar.classList.add("hidden");
    app.classList.add("hidden");
  }

  function logout() {
    token = "";
    sessionStorage.removeItem(TKEY);
    if (timer) { clearInterval(timer); timer = null; }
    showGate();
  }

  // ---- Health classification ----
  function healthClass(h) {
    switch ((h || "").toLowerCase()) {
      case "healthy": return "good";
      case "warning": return "warn";
      case "error": return "bad";
      case "disabled": return "idle";
      default: return "idle";
    }
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return Math.floor(diff) + "秒前";
    if (diff < 3600) return Math.floor(diff / 60) + "分前";
    if (diff < 86400) return Math.floor(diff / 3600) + "時間前";
    return d.toLocaleString();
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render(clusters, servers, events) {
    const clusterName = {};
    clusters.forEach((c) => (clusterName[c.id] = c.name));

    // ---- stats ----
    const total = servers.length;
    const reachable = servers.filter((s) => s.last_ok).length;
    const down = total - reachable;
    const degraded = servers.filter((s) => {
      const ds = (s.last_health && s.last_health.domains) || [];
      return ds.some((d) => d.enabled && /warning|error/i.test(d.health || ""));
    }).length;
    $("stats").innerHTML = [
      ["サーバ総数", total, ""],
      ["到達可能", reachable + '<small> / ' + total + "</small>", ""],
      ["到達不可", down, down > 0 ? "alarm" : ""],
      ["劣化ドメイン有", degraded, degraded > 0 ? "alarm" : ""],
    ].map(([k, v, cls]) =>
      `<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div></div>`
    ).join("");

    // ---- clusters (cards with the auto-failover policy) ----
    $("cluster-count").textContent = clusters.length;
    const counts = {};
    servers.forEach((s) => { const c = s.cluster || "_"; counts[c] = (counts[c] || 0) + 1; });
    const serverName = {};
    servers.forEach((s) => { serverName[s.id] = s.name; });
    $("clusters").innerHTML = clusters.length
      ? clusters.map((c) => {
          const ap = c.active_primary ? esc(serverName[c.active_primary] || c.active_primary) : "—";
          const th = c.failure_threshold || 3;
          return `<div class="chip-cluster">
            <div class="cl-top"><span class="nm">${esc(c.name)}</span><span class="ct">${counts[c.id] || 0} 台</span></div>
            <div class="cl-primary">アクティブ primary: <b>${ap}</b></div>
            <div class="cl-fo">
              <label class="switch"><input type="checkbox" data-fo="${esc(c.id)}" ${c.auto_failover ? "checked" : ""}/> 自動フェイルオーバー</label>
              <span>閾値 <input type="number" min="1" max="60" value="${th}" data-fo-th="${esc(c.id)}" title="連続失敗回数"/></span>
            </div>
            <div class="cl-dns" title="フェイルオーバー時に付け替える DNS レコード">
              <span class="cl-dns-lbl">DNS 付け替え</span>
              <input type="text" data-dns-name="${esc(c.id)}" value="${esc(c.dns_name || "")}" placeholder="app.example.com" title="レコード名 (FQDN)"/>
              <input type="text" data-dns-zone="${esc(c.id)}" value="${esc(c.dns_zone || "")}" placeholder="example.com" title="ゾーン apex"/>
              <span>TTL <input type="number" min="1" max="86400" value="${c.dns_ttl || 60}" data-dns-ttl="${esc(c.id)}"/></span>
            </div>
          </div>`;
        }).join("")
      : `<span class="chip-cluster unassigned">クラスタ未作成</span>`;
    if (counts["_"]) {
      $("clusters").innerHTML +=
        `<span class="chip-cluster unassigned"><span class="nm">未割り当て</span>
         <span class="ct">${counts["_"]} 台</span></span>`;
    }

    // ---- cluster select in the register form ----
    const sel = $("sv-cluster"), prev = sel.value;
    sel.innerHTML = '<option value="">（未割り当て）</option>' +
      clusters.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
    sel.value = prev;

    // ---- servers ----
    $("server-count").textContent = total;
    const tbody = $("server-rows");
    if (!total) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty">サーバが登録されていません。下の「サーバを登録」から追加してください。</div></td></tr>`;
      return;
    }
    // which sid is the active primary of each server's cluster
    const activeOf = {};
    clusters.forEach((c) => { if (c.active_primary) activeOf[c.active_primary] = true; });
    tbody.innerHTML = servers.map((s) => {
      const fenceBadge = s.fenced ? `<div class="badge-fence" title="旧primary。復帰時に自動降格されます">⚠ fenced</div>` : "";
      const activeBadge = activeOf[s.id] ? `<span class="badge-active" title="このクラスタのアクティブ primary">ACTIVE</span>` : "";
      const reach = s.last_ok
        ? `<span class="pill good"><span class="d"></span>到達可</span>`
        : `<span class="pill bad"><span class="d"></span>到達不可</span>`;
      const ds = (s.last_health && s.last_health.domains) || [];
      const enabled = ds.filter((d) => d.enabled);
      const domains = enabled.length
        ? `<div class="domains">` + enabled.map((d) => {
            const cls = healthClass(d.health);
            const role = d.role && d.role !== "standalone" ? ` <span class="role-tag">${esc(d.role)}</span>` : "";
            return `<span class="dchip ${cls}" title="${esc(d.domain)}: ${esc(d.health)}${d.role ? " / " + esc(d.role) : ""}"><span class="d"></span>${esc(d.domain)}${role}</span>`;
          }).join("") + `</div>`
        : `<span class="muted">—</span>`;
      const err = (!s.last_ok && s.last_error)
        ? `<div class="err-line" title="${esc(s.last_error)}">${esc(s.last_error)}</div>` : "";
      const cl = s.cluster ? esc(clusterName[s.cluster] || s.cluster)
                           : `<span class="muted">未割り当て</span>`;
      const sid = s.server_id ? `<div class="srv-id" title="server id">${esc(s.server_id)}</div>` : "";
      // Offer promote when any domain still tracks a primary (secondary), demote when any
      // acts as primary (a promoted secondary — or a configured primary, where it no-ops).
      const hasSecondary = enabled.some((d) => d.role === "secondary");
      const hasPrimary = enabled.some((d) => d.role === "primary");
      const promoteBtn = (s.last_ok && hasSecondary)
        ? `<button class="btn sm" data-promote="${esc(s.id)}" data-name="${esc(s.name)}" title="pull を停止し primary として権威化">昇格</button>` : "";
      const demoteBtn = (s.last_ok && hasPrimary)
        ? `<button class="btn ghost sm" data-demote="${esc(s.id)}" data-name="${esc(s.name)}" title="pull を再開し secondary に戻す">降格</button>` : "";
      const intent = s.intent || "unset";
      const intentSel = `<select class="intent-sel" data-intent="${esc(s.id)}" title="フェイルオーバー時の役割意図">
          <option value="unset"${intent === "unset" ? " selected" : ""}>—</option>
          <option value="primary"${intent === "primary" ? " selected" : ""}>primary</option>
          <option value="standby"${intent === "standby" ? " selected" : ""}>standby</option>
        </select>
        <input type="text" class="dns-target" data-dns-target="${esc(s.id)}" value="${esc(s.dns_target || "")}" placeholder="DNS先IP" title="このサーバがactiveのときDNSが指すIP"/>`;
      return `<tr>
        <td><div class="srv-name">${esc(s.name)}${activeBadge}</div><div class="srv-url">${esc(s.base_url)}</div>${sid}</td>
        <td>${reach}${err}${fenceBadge}</td>
        <td>${domains}</td>
        <td>${cl}</td>
        <td>${intentSel}</td>
        <td class="muted">${fmtTime(s.last_seen)}</td>
        <td><div class="row-actions">${promoteBtn}${demoteBtn}<button class="btn ghost sm danger" data-del="${esc(s.id)}" data-name="${esc(s.name)}">削除</button></div></td>
      </tr>`;
    }).join("");

    // ---- events ----
    renderEvents(events || []);
  }

  function renderEvents(events) {
    $("event-count").textContent = events.length;
    const el = $("events");
    if (!events.length) {
      el.innerHTML = `<div class="empty">まだフェイルオーバー イベントはありません。</div>`;
      return;
    }
    el.innerHTML = events.map((e) => {
      const kind = (e.kind || "info").toLowerCase();
      const cls = kind === "error" ? "error" : (kind === "failover" ? "failover" : "");
      return `<div class="event ${cls}">
        <span class="ev-time">${fmtTime(e.at)}</span>
        <span class="ev-kind">${esc(e.kind || "")}</span>
        <span class="ev-msg">${esc(e.message || "")}</span>
      </div>`;
    }).join("");
  }

  function renderLeader(center) {
    const el = $("lead-badge");
    if (!center) { el.hidden = true; return; }
    el.hidden = false;
    if (center.is_leader) {
      el.className = "lead-badge leader";
      el.textContent = "リーダー";
      el.title = "この Center が失敗検知・フェイルオーバーを実行中 (id " + (center.id || "") + ")";
    } else {
      el.className = "lead-badge standby";
      const holder = (center.leader && center.leader.holder) || "—";
      el.textContent = "スタンバイ";
      el.title = "リーダーは " + holder + " (この id " + (center.id || "") + ")";
    }
  }

  async function refresh() {
    try {
      const data = await api("/status");
      render(data.clusters || [], data.servers || [], data.events || []);
      renderLeader(data.center);
      setConn(true, "接続中");
    } catch (e) {
      setConn(false, e.message || "エラー");
    }
  }

  function startAuto() {
    if (timer) clearInterval(timer);
    if ($("auto").checked) timer = setInterval(refresh, 10000);
  }

  // ---- events ----
  $("gate-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = $("gate-token").value.trim();
    if (!v) return;
    token = v;
    try {
      await api("/status"); // validate the token
      sessionStorage.setItem(TKEY, token);
      $("gate-token").value = "";
      showApp();
      await refresh();
      startAuto();
    } catch (err) {
      token = "";
      toast(err.message || "接続に失敗しました", true);
    }
  });

  $("btn-refresh").addEventListener("click", refresh);
  $("btn-logout").addEventListener("click", logout);
  $("auto").addEventListener("change", startAuto);

  $("cluster-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("cl-name").value.trim();
    if (!name) return;
    try {
      await api("/clusters", { method: "POST", body: JSON.stringify({ name }) });
      $("cl-name").value = "";
      toast("クラスタ「" + name + "」を作成しました");
      await refresh();
    } catch (err) { toast(err.message, true); }
  });

  $("server-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
      name: $("sv-name").value.trim(),
      base_url: $("sv-url").value.trim(),
      token: $("sv-token").value,
      cluster: $("sv-cluster").value || undefined,
    };
    try {
      await api("/servers", { method: "POST", body: JSON.stringify(body) });
      $("sv-name").value = ""; $("sv-url").value = ""; $("sv-token").value = "";
      toast("サーバ「" + body.name + "」を登録しました");
      await refresh();
    } catch (err) { toast(err.message, true); }
  });

  async function roleChange(id, name, action, verb) {
    if (!confirm("サーバ「" + name + "」を" + verb + "しますか？（全管理ドメイン）")) return;
    try {
      const res = await api("/servers/" + encodeURIComponent(id) + "/" + action, { method: "POST" });
      const changed = (res && res.changed) || [];
      toast(changed.length
        ? "「" + name + "」を" + verb + ": " + changed.join(", ")
        : "「" + name + "」に" + verb + "対象のドメインはありませんでした");
      await refresh();
    } catch (err) { toast(err.message, true); }
  }

  $("server-rows").addEventListener("click", async (e) => {
    const del = e.target.closest("[data-del]");
    const prom = e.target.closest("[data-promote]");
    const dem = e.target.closest("[data-demote]");
    if (prom) return roleChange(prom.getAttribute("data-promote"), prom.getAttribute("data-name"), "promote", "昇格");
    if (dem) return roleChange(dem.getAttribute("data-demote"), dem.getAttribute("data-name"), "demote", "降格");
    if (!del) return;
    const id = del.getAttribute("data-del");
    const name = del.getAttribute("data-name");
    if (!confirm("サーバ「" + name + "」を登録解除しますか？")) return;
    try {
      await api("/servers/" + encodeURIComponent(id), { method: "DELETE" });
      toast("サーバ「" + name + "」を登録解除しました");
      await refresh();
    } catch (err) { toast(err.message, true); }
  });

  // per-server change: intent selector or DNS target
  $("server-rows").addEventListener("change", async (e) => {
    const sel = e.target.closest("[data-intent]");
    const dns = e.target.closest("[data-dns-target]");
    if (sel) {
      const id = sel.getAttribute("data-intent");
      try {
        await api("/servers/" + encodeURIComponent(id) + "/intent", {
          method: "POST", body: JSON.stringify({ intent: sel.value }),
        });
        toast("役割意図を " + sel.value + " に設定しました");
        await refresh();
      } catch (err) { toast(err.message, true); await refresh(); }
      return;
    }
    if (dns) {
      const id = dns.getAttribute("data-dns-target");
      try {
        await api("/servers/" + encodeURIComponent(id) + "/dns-target", {
          method: "POST", body: JSON.stringify({ ip: dns.value.trim() }),
        });
        toast(dns.value.trim() ? "DNS先IPを設定しました" : "DNS先IPをクリアしました");
        await refresh();
      } catch (err) { toast(err.message, true); await refresh(); }
    }
  });

  // cluster failover policy (toggle + threshold)
  async function savePolicy(cid) {
    const cb = document.querySelector(`[data-fo="${cid}"]`);
    const th = document.querySelector(`[data-fo-th="${cid}"]`);
    if (!cb) return;
    try {
      await api("/clusters/" + encodeURIComponent(cid) + "/failover-policy", {
        method: "POST",
        body: JSON.stringify({ auto_failover: cb.checked, failure_threshold: Number(th && th.value) || 3 }),
      });
      toast("自動フェイルオーバー設定を保存しました");
      await refresh();
    } catch (err) { toast(err.message, true); await refresh(); }
  }
  // cluster DNS-failover policy (name / zone / ttl)
  async function saveDnsPolicy(cid) {
    const name = document.querySelector(`[data-dns-name="${cid}"]`);
    const zone = document.querySelector(`[data-dns-zone="${cid}"]`);
    const ttl = document.querySelector(`[data-dns-ttl="${cid}"]`);
    try {
      await api("/clusters/" + encodeURIComponent(cid) + "/dns-policy", {
        method: "POST",
        body: JSON.stringify({
          name: (name && name.value.trim()) || "",
          zone: (zone && zone.value.trim()) || "",
          ttl: Number(ttl && ttl.value) || 60,
        }),
      });
      toast("DNS付け替え設定を保存しました");
      await refresh();
    } catch (err) { toast(err.message, true); await refresh(); }
  }
  $("clusters").addEventListener("change", (e) => {
    const cb = e.target.closest("[data-fo]");
    const th = e.target.closest("[data-fo-th]");
    const dn = e.target.closest("[data-dns-name]");
    const dz = e.target.closest("[data-dns-zone]");
    const dt = e.target.closest("[data-dns-ttl]");
    if (cb) return savePolicy(cb.getAttribute("data-fo"));
    if (th) return savePolicy(th.getAttribute("data-fo-th"));
    if (dn) return saveDnsPolicy(dn.getAttribute("data-dns-name"));
    if (dz) return saveDnsPolicy(dz.getAttribute("data-dns-zone"));
    if (dt) return saveDnsPolicy(dt.getAttribute("data-dns-ttl"));
  });

  // ---- boot ----
  if (token) {
    showApp();
    refresh().then(startAuto);
  } else {
    showGate();
  }
})();
</script>
</body>
</html>
