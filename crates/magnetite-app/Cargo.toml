[package]
name = "magnetite-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
magnetite-core = { workspace = true }
magnetite-db = { workspace = true, optional = true }
magnetite-dns = { workspace = true, optional = true }
magnetite-mail = { workspace = true, optional = true }
magnetite-addc = { workspace = true, optional = true }
magnetite-ldap = { workspace = true, optional = true }
magnetite-k8s = { workspace = true, optional = true }

leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
leptos_axum = { workspace = true, optional = true }
server_fn = { workspace = true, optional = true }

axum = { workspace = true, optional = true }
tower-cookies = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

wasm-bindgen = { workspace = true, optional = true }
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[features]
default = []
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:server_fn",
    "dep:axum",
    "dep:tower-cookies",
    "dep:tokio",
    "dep:magnetite-db",
    "dep:magnetite-dns",
    "dep:magnetite-mail",
    "dep:magnetite-addc",
    "dep:magnetite-ldap",
    "dep:magnetite-k8s",
]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
]

[lib]
crate-type = ["cdylib", "rlib"]
