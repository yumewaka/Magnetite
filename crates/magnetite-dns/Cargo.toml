[package]
name = "magnetite-dns"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
magnetite-core = { workspace = true }
magnetite-db = { workspace = true }
magnetite-krb5 = { workspace = true }

hickory-proto = { workspace = true }
rustls-pki-types = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
data-encoding = "2"
# Outbound HTTPS client for the dynamic-DNS updater (real cert verification via bundled
# webpki roots — this talks to public DDNS providers, unlike the danger-TLS repl feeds).
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
rustls = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = "3"
