# TEMPLATE ONLY — the admin bearer token Secret guarding the control-plane API.
#
# Do NOT add this file to kustomization.yaml `resources`, and do NOT commit a real
# token. A Secret listed in `resources` is re-created on every `kubectl apply -k`,
# silently overwriting the live token — every managed-server registration would then
# reject the center's calls until the token is reconciled everywhere.
#
# Create the real Secret once, out of band (this is the only step the README needs):
#   kubectl -n magnetite-center create secret generic magnetite-center-admin \
#     --from-literal=token=$(openssl rand -hex 32)
#
# Copy this file to a gitignored `secret.yaml` and `kubectl apply` it only if you
# prefer a file-based workflow — never leave a real token in the committed template.
apiVersion: v1
kind: Secret
metadata:
  name: magnetite-center-admin
type: Opaque
stringData:
  # Replace with a strong random value, e.g. `openssl rand -hex 32`.
  token: "REPLACE_WITH_A_STRONG_RANDOM_TOKEN"
