# Optional: expose the web UI over HTTP(S). Requires an ingress controller
# (nginx, Traefik, ...). Set the host to your domain and, for TLS, reference a
# certificate Secret (e.g. issued by cert-manager). Terminate TLS here — the
# Magnetite web UI itself speaks plain HTTP on :4000.
#
# Remember to set [server].base_url in the config to the external URL below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: magnetite
  labels:
    app.kubernetes.io/name: magnetite
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # ingressClassName: nginx
  rules:
    - host: magnetite.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: magnetite
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - magnetite.example.com
  #     secretName: magnetite-tls
